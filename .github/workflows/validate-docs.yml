name: Validate Repository Structure

on:
  push:
    branches:
      - main

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          test -d docs

      - name: Check README exists
        run: |
          test -f README.md


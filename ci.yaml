name: Build, Test and Dockerise

on:
  push:            # every push, on every branch (including part-3-mvc)
  pull_request:

jobs:
  build-and-test:
    name: Build API + MVC and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build API (RaceDay.Api)
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build MVC web app (RaceDay.Web)
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

      - name: Build whole solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run API and MVC tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC image
        run: docker build --tag raceday-web:ci ./RaceDay.Web

      - name: Build API image
        run: docker build --tag raceday-api:ci ./RaceDay.Api
